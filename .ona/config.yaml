tasks:
  validate-godot-project:
    name: Validate Godot project
    description: Import the Godot project and report scene or script loading errors.
    command: godot4 --headless --path . --import
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  godot-demo:
    name: Game web preview
    description: Direct browser playtest for tablets and phones. The primary Run service.
    commands:
      start: |
        gitpod environment port open 8080 --admission creator_only --name "Game web preview" --protocol http
        bash scripts/dev/start_web_preview.sh
      ready: curl --fail --silent http://127.0.0.1:8080/ > /dev/null
    triggeredBy:
      - manual
      - postEnvironmentStart
